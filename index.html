<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Romantic Speed Date Timer</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Poppins:wght@700&display=swap');

    body {
      margin: 0;
      padding: 15px;
      background: transparent;
      font-family: 'Fredoka', cursive, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .timer-card {
      width: 320px;
      background: rgba(25, 10, 20, 0.92);
      backdrop-filter: blur(12px);
      border-radius: 24px;
      border: 3px solid #ff4d6d;
      box-shadow: 0 0 25px rgba(255, 77, 109, 0.5), inset 0 0 15px rgba(255, 77, 109, 0.2);
      padding: 20px;
      text-align: center;
      color: #fff;
      position: relative;
    }

    .title {
      font-size: 14px;
      font-family: 'Poppins', sans-serif;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #ff85a1;
      margin-bottom: 5px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .time-display {
      font-size: 58px;
      font-weight: 700;
      color: #fff0f3;
      text-shadow: 0 0 15px #ff4d6d, 0 0 30px #ff0054;
      margin: 5px 0 15px 0;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    .status-badge {
      font-size: 11px;
      font-family: 'Poppins', sans-serif;
      padding: 4px 10px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.1);
      color: #ffb3c1;
      margin-bottom: 12px;
      display: inline-block;
    }

    .controls {
      display: flex;
      justify-content: center;
      gap: 10px;
    }

    button {
      font-family: 'Poppins', sans-serif;
      font-weight: 700;
      font-size: 13px;
      border: none;
      border-radius: 30px;
      padding: 8px 16px;
      cursor: pointer;
      transition: all 0.2s ease;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .btn-start {
      background: linear-gradient(135deg, #ff4d6d, #ff0054);
      color: white;
      box-shadow: 0 4px 15px rgba(255, 0, 84, 0.4);
    }

    .btn-start:hover { transform: scale(1.05); }

    .btn-stop {
      background: rgba(255, 255, 255, 0.15);
      color: #ffb3c1;
      border: 1px solid rgba(255, 179, 193, 0.3);
    }

    .mode-switch {
      margin-top: 10px;
      font-size: 10px;
      color: #ffb3c1;
      opacity: 0.8;
    }

    .mode-switch a {
      color: #ff4d6d;
      text-decoration: underline;
      cursor: pointer;
    }

    .pulse-warning {
      animation: heartPulse 1s infinite alternate;
      color: #ff0054 !important;
    }

    .time-up-flash {
      animation: timeUpFlash 0.6s ease-in-out 3;
    }

    @keyframes heartPulse {
      0% { transform: scale(1); text-shadow: 0 0 10px #ff0054; }
      100% { transform: scale(1.08); text-shadow: 0 0 25px #ff0054, 0 0 40px #ff0054; }
    }

    @keyframes timeUpFlash {
      0% { border-color: #ff4d6d; }
      50% { border-color: #ffffff; box-shadow: 0 0 50px rgba(255, 255, 255, 1); }
      100% { border-color: #ff4d6d; }
    }
  </style>
</head>
<body>

  <div class="timer-card" id="card">
    <div class="title">❤️ Speed Date ❤️</div>
    <div class="time-display" id="timer">04:00</div>
    <div class="status-badge" id="statusBadge">Initializing...</div>
    
    <div class="controls" id="controlPanel">
      <button class="btn-start" id="startBtn" onclick="sendAction('START')">Start</button>
      <button class="btn-stop" id="stopBtn" onclick="sendAction('STOP')">Stop</button>
      <button class="btn-stop" onclick="sendAction('RESET')">Reset</button>
    </div>

    <div class="mode-switch" id="modeSwitch">
      Mode: <span id="modeText">Display</span> | <a onclick="toggleMode()">Switch Mode</a>
    </div>
  </div>

  <script>
    const INITIAL_TIME = 4 * 60;
    let timeLeft = INITIAL_TIME;
    let timerInterval = null;

    const timerDisplay = document.getElementById('timer');
    const startBtn = document.getElementById('startBtn');
    const card = document.getElementById('card');
    const statusBadge = document.getElementById('statusBadge');
    const modeText = document.getElementById('modeText');

    const HOST_ID = "captain-josh-speeddate-display";
    let peer = null;
    let conn = null;

    // Default to controller mode unless specified
    const urlParams = new URLSearchParams(window.location.search);
    let isController = urlParams.get('mode') === 'controller';

    function initSync() {
      if (peer) peer.destroy();

      if (isController) {
        modeText.innerText = "Remote Controller";
        statusBadge.innerText = "Connecting to TikTok Stream...";
        peer = new Peer();

        peer.on('open', () => { connectToDisplay(); });
        peer.on('error', (err) => {
          statusBadge.innerText = "Stream Display Not Ready";
          setTimeout(connectToDisplay, 3000);
        });

      } else {
        modeText.innerText = "Stream Overlay (Display)";
        peer = new Peer(HOST_ID);

        peer.on('open', () => {
          statusBadge.innerText = "Ready for Controller";
        });

        peer.on('connection', (connection) => {
          conn = connection;
          statusBadge.innerText = "Controller Connected!";
          conn.on('data', (action) => handleAction(action));
        });

        peer.on('error', (err) => {
          if (err.type === 'unavailable-id') {
            statusBadge.innerText = "Display Already Active";
          }
        });
      }
    }

    function connectToDisplay() {
      if (!isController) return;
      conn = peer.connect(HOST_ID);
      conn.on('open', () => {
        statusBadge.innerText = "Connected to TikTok Stream!";
      });
      conn.on('close', () => {
        statusBadge.innerText = "Disconnected. Retrying...";
        setTimeout(connectToDisplay, 3000);
      });
    }

    function toggleMode() {
      isController = !isController;
      initSync();
    }

    function sendAction(action) {
      handleAction(action);
      if (isController && conn && conn.open) {
        conn.send(action);
      }
    }

    function handleAction(action) {
      if (action === 'START') startTimerLocal();
      if (action === 'STOP') stopTimerLocal();
      if (action === 'RESET') resetTimerLocal();
    }

    function playRomanticChime() {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const ctx = new AudioContext();
        const notes = [523.25, 659.25, 783.99, 987.77, 1046.50, 1318.51];
        
        notes.forEach((freq, index) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();

          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, ctx.currentTime + (index * 0.12));

          gain.gain.setValueAtTime(0.01, ctx.currentTime + (index * 0.12));
          gain.gain.exponentialRampToValueAtTime(0.3, ctx.currentTime + (index * 0.12) + 0.05);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + (index * 0.12) + 0.8);

          osc.connect(gain);
          gain.connect(ctx.destination);

          osc.start(ctx.currentTime + (index * 0.12));
          osc.stop(ctx.currentTime + (index * 0.12) + 0.85);
        });
      } catch (e) {}
    }

    function updateDisplay() {
      const minutes = Math.floor(timeLeft / 60);
      const seconds = timeLeft % 60;
      timerDisplay.innerText = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;

      if (timeLeft <= 30 && timeLeft > 0) {
        timerDisplay.classList.add('pulse-warning');
      } else {
        timerDisplay.classList.remove('pulse-warning');
      }
    }

    function startTimerLocal() {
      if (timerInterval) return;

      startBtn.innerText = "Running...";
      startBtn.style.opacity = "0.7";

      timerInterval = setInterval(() => {
        if (timeLeft > 0) {
          timeLeft--;
          updateDisplay();
        } else {
          clearInterval(timerInterval);
          timerInterval = null;
          playRomanticChime();

          card.classList.add('time-up-flash');
          setTimeout(() => card.classList.remove('time-up-flash'), 2000);

          setTimeout(() => { resetTimerLocal(); }, 1500);
        }
      }, 1000);
    }

    function stopTimerLocal() {
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
        startBtn.innerText = "Resume";
        startBtn.style.opacity = "1";
      }
    }

    function resetTimerLocal() {
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
      }
      timeLeft = INITIAL_TIME;
      startBtn.innerText = "Start";
      startBtn.style.opacity = "1";
      updateDisplay();
    }

    updateDisplay();
    initSync();
  </script>

</body>
</html>
</body>
</html>
